name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 不要直接描述功能，先说清痛点。这决定了建议是否值得做。
      placeholder: |
        作为用户，我希望能看到某类项目的失败原因分布，
        因为现在只能一条条点开看，10 个项目要点 10 次。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你设想的做法是什么？可以配合示意图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 哪怕你觉得自己的方案最好，也请写一下备选。

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅新增页面
        - 改动现有页面
        - 涉及云函数 / 数据库
        - 涉及商业化模块
        - 纯文档
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 相关 Issue 编号、截图、参考资料
