name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 项目自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./scripts/check.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 确认本地私有文件未被跟踪
        shell: pwsh
        run: |
          $tracked = git ls-files
          $forbidden = @(
            'project.private.config.json',
            '.env',
            'node_modules'
          )
          $bad = $false
          foreach ($f in $forbidden) {
            if ($tracked -contains $f) {
              Write-Host "::error::敏感文件被提交进版本库：$f"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
          Write-Host "OK - 未跟踪任何本地私有文件"

      - name: 校验换行符与属性
        shell: pwsh
        run: |
          # 仓库内不应出现 CRLF（.gitattributes 已强制 LF）
          $crlf = git grep -Il --cached -e "`r" -- '*.js' '*.json' '*.wxml' '*.wxss' '*.md' 2>$null
          if ($crlf) {
            Write-Host "::error::以下文件仍含 CRLF："
            $crlf | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "OK - 换行符统一为 LF"

  syntax:
    name: JS 语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check.ps1 在 Windows runner 上没有 node，只能跳过语法检查。
      # 这里用 ubuntu 把它变成硬门禁：小程序项目没有单元测试，
      # 语法错误就是唯一一道会在部署后才暴露的关卡。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check 全部 JS
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r f; do
            node --check "$f"
            COUNT=$((COUNT + 1))
          done < <(find miniprogram cloudfunctions scripts -name '*.js' -not -path '*/node_modules/*' | sort)
          echo "OK - 语法检查通过：${COUNT} 个文件"

      - name: WXML 引用的页面方法确实存在
        shell: bash
        run: |
          # WXML 里 bindtap="foo" 但 JS 没有 foo() 的情况不会报错，
          # 只会在真机上「点了没反应」。这里做一次静态交叉检查。
          set -euo pipefail
          bad=0
          for wxml in $(find miniprogram/pages -name '*.wxml' | sort); do
            js="${wxml%.wxml}.js"
            [ -f "$js" ] || continue
            handlers=$(grep -oE '(bind|catch)(tap|input|change|confirm|blur|focus|longpress|submit|scrolltolower|reachbottom|shareappmessage|sharetimeline|load|show|hide)="[a-zA-Z_$][a-zA-Z0-9_$]*"' "$wxml" \
              | sed -E 's/.*="([^"]*)"/\1/' | sort -u)
            for h in $handlers; do
              # 小程序框架自身提供的事件与生命周期不走 Page 定义，跳过
              case "$h" in
                onLoad|onShow|onHide|onUnload|onPullDownRefresh|onReachBottom|onPageScroll|onShareAppMessage|onShareTimeline|onTabItemTap|onResize|onTabItemTap) continue ;;
              esac
              if ! grep -qE "(^|[^a-zA-Z0-9_$])$h[[:space:]]*\(" "$js"; then
                echo "::error file=$wxml::$h 在 $(basename "$js") 中没有定义"
                bad=1
              fi
            done
          done
          [ "$bad" -eq 0 ] && echo "OK - WXML 事件绑定均有对应方法"
          exit $bad

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查提交历史中的密钥
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置 gitleaks 密钥时使用开源规则，不强制要求 licence
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  size:
    name: 体积检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查主包体积
        shell: bash
        run: |
          # 微信小程序主包上限 2 MB
          LIMIT=$((2 * 1024 * 1024))
          ACTUAL=$(du -sb miniprogram | cut -f1)
          echo "miniprogram/ = $ACTUAL bytes (limit $LIMIT)"
          if [ "$ACTUAL" -gt "$LIMIT" ]; then
            echo "::error::主包超出 2 MB 上限"
            exit 1
          fi
          echo "OK - 主包体积在限制内"
